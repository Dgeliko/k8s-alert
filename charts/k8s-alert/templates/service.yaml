apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-alert.fullname" . }}
  labels:
    {{- include "k8s-alert.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "k8s-alert.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
