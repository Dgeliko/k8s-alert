# Single instance owns the incident/checkpoint state.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/dgeliko/k8s-alert
  tag: "" # defaults to v<Chart.appVersion>
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  name: ""
reloader:
  enabled: true # Stakater Reloader must already be installed in the cluster.
  auto: true # Watch referenced ConfigMaps and Secrets. Set false to watch only the chart's config and destination Secrets.
persistence:
  enabled: true
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
networkPolicy:
  enabled: false
config:
  version: 1
  cluster: dev
  env-type: dev # prod notifies on the first observed crash; dev defaults to 3 in 5m.
  filters:
    namespaces: {include: [], exclude: []}
    pod-names: {include: [], exclude: []}
    kinds: {include: [], exclude: []} # Set exclude: [Job, CronJob] to ignore them and their pods.
    label-selector: ""
  restarts:
    # threshold: 3 # Omit to inherit dev=3 / prod=1.
    window: 5m
  notifications:
    group-by: workload # pod: each replacement pod starts a separate incident.
    repeat-interval: 30m
    recovery: true
    recovery-stable-for: 2m
  logs:
    enabled: true
    tail-lines: 15
    max-bytes: 16384
    max-pods: 3
    timeout: 5s
    redact-patterns: []
  detectors:
    container-crash: {enabled: true}
    oom-killed: {enabled: true}
    probe-failure: {enabled: true}
    crash-loop: {enabled: true, for: 2m}
    image-pull-failure: {enabled: true, for: 60s}
    container-config-failure: {enabled: true, for: 60s}
    pod-pending: {enabled: true, for: 240s}
    pod-not-ready: {enabled: true, for: 120s}
    workload-unavailable: {enabled: true, for: 120s}
    rollout-failed: {enabled: true, for: 30s}
    replicaset-failed-create: {enabled: true, for: 30s}
  overrides: []
# Secret names/keys only; credential values never appear in Helm values.
destinations:
  - name: pachca
    type: pachca
    enabled: true
    existingSecret: k8s-alert-pachca
    url-key: url
  - name: telegram
    type: telegram
    enabled: false
    existingSecret: k8s-alert-telegram
    token-key: bot-token
    chat-id: ""
    # message-thread-id: 42
