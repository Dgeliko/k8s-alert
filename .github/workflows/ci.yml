name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: make chart
      - run: python3 scripts/check-chart.py
      - run: make release-binaries VERSION=ci
      - run: helm package charts/k8s-alert --destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: k8s-alert-linux-and-chart
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: k8s-alert:ci
          build-args: VERSION=ci
      - name: Verify container entrypoint
        run: test "$(docker run --rm k8s-alert:ci --version)" = ci
