name: Release
on:
  push:
    tags: ['v*.*.*']
  create:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag (for example v0.1.0)'
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.event.ref || github.ref_name }}
        shell: bash
        run: |
          TAG="${RAW_VERSION#release/}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release version'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
  preflight:
    needs: [verify, version]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version and prevent replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Use a version such as v0.1.0'; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo 'This release already exists; choose a new version.'; exit 1
          fi
          if [[ "$EVENT" != push ]] && gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'This tag already exists. Push-tag release or choose a new version.'; exit 1
          fi
  binaries-and-chart:
    needs: [preflight, image, version]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - run: go mod download
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Package Linux binaries and Helm chart
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          make release-binaries VERSION="$TAG"
          helm package charts/k8s-alert --version "$VERSION" --app-version "$VERSION" --destination dist
          cd dist
          sha256sum k8s-alert-* > SHA256SUMS
      - name: Publish chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_USER" --password-stdin
          CHART_OWNER=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm push dist/k8s-alert-*.tgz "oci://ghcr.io/$CHART_OWNER/charts"
      - name: Attach compiled binaries and chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "k8s-alert $TAG"
  image:
    needs: [preflight, version]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_TAG }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
